version: '3.8'
services:
  db:
    image: postgres:16
    container_name: expenses_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ta123456789
      POSTGRES_DB: expenses
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: expenses_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Ta123456789@db/expenses

  frontend:
    build: ./frontend
    container_name: expenses_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: